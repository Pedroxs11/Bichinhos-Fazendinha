name: Android CI

on:
  push:
    branches:
      - feat/v1-base
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/test-signing/bichinhos-debug.keystore.b64 > "$HOME/.android/debug.keystore"

      - name: Inspect CC0 baby animal audio pack
        run: |
          set -euo pipefail
          mkdir -p .ci-audio
          curl -fL --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/baby-animals_0.zip" \
            -o .ci-audio/baby-animals.zip
          unzip -l .ci-audio/baby-animals.zip

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bichinhos-fazendinha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
