name: Build Paint Prototype

on:
  workflow_dispatch:
  push:
    branches: [ paint-by-number-prototype ]
    paths:
      - 'paintprototype/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-paint-prototype.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=Android Debug,O=Android,C=US"             -keyalg RSA             -keysize 2048             -validity 10000
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build prototype APK
        run: gradle :paintprototype:assembleRelease --stacktrace
      - name: Verify APK signature
        run: |
          APK="paintprototype/build/outputs/apk/release/paintprototype-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: pintura-por-numero-release
          path: paintprototype/build/outputs/apk/release/paintprototype-release.apk
