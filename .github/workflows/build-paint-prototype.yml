name: Build Paint Prototype

on:
  workflow_dispatch:
  push:
    branches: [ paint-by-number-prototype ]
    paths:
      - 'paintprototype/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-paint-prototype.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build prototype APK
        run: gradle :paintprototype:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pintura-por-numero-prototype
          path: paintprototype/build/outputs/apk/debug/paintprototype-debug.apk
