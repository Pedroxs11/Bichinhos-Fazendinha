name: Paint Prototype Build

on:
  push:
    branches: [paint-by-number-prototype]
    paths:
      - "paintprototype/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/paint-prototype-build.yml"
  pull_request:
    branches: [paint-by-number-prototype]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build paint prototype
        run: gradle :paintprototype:assembleDebug --stacktrace
