name: Validate Paint Play Prep

on:
  push:
    branches:
      - paint-play-internal-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release AAB
        run: |
          gradle :paintprototype:bundleRelease --stacktrace
          test -s paintprototype/build/outputs/bundle/release/paintprototype-release.aab
      - name: Verify Play package and API
        run: |
          grep 'applicationId = "com.pedroxs11.colorbynumber"' paintprototype/build.gradle.kts
          grep 'targetSdk = 36' paintprototype/build.gradle.kts
